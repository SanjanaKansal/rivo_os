{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Sources - Rivo OS{% endblock %}

{% block content %}
{% include 'dashboard/navigation.html' %}

<div id="main-content" class="min-h-screen bg-gray-50 dark:bg-gray-950 transition-all duration-200">
    <main class="h-[calc(100vh-3.5rem)] lg:h-screen flex flex-col" style="padding: var(--space-page);">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center px-6 py-3 border-b border-gray-100 dark:border-gray-800">
                <h2 class="text-sm font-medium text-gray-900 dark:text-gray-100">All Sources</h2>
                <button id="refresh-btn" class="p-1.5 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-md" title="Refresh">
                    <svg id="refresh-icon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
            <div id="content-area" class="flex-1 overflow-auto">
                <div class="px-6 py-8 text-center text-sm text-gray-400">Loading...</div>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-900 rounded-lg w-full max-w-md border border-gray-200 dark:border-gray-800">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100 px-6 py-4 border-b border-gray-100 dark:border-gray-800">Bulk Assign Leads</h3>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Source</label>
                <input type="text" id="modal-source" readonly class="w-full px-3 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-md bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-400">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Assign to</label>
                <select id="modal-user" class="w-full px-3 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-400">
                    <option value="">Select a user...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Limit</label>
                <input type="number" id="modal-limit" value="100" class="w-full px-3 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-400">
            </div>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-100 dark:border-gray-800">
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700">Cancel</button>
            <button id="modal-confirm" class="px-4 py-2 text-sm font-medium text-white bg-gray-900 dark:bg-gray-100 dark:text-gray-900 rounded-md hover:bg-gray-800 dark:hover:bg-gray-200">Assign</button>
        </div>
    </div>
</div>

<style>
.grid-row { grid-template-columns: 2fr 1fr 1fr; }
</style>

<script src="{% static 'dashboard/js/permissions.js' %}"></script>
<script src="{% static 'dashboard/js/components.js' %}"></script>
<script>
const state = { sourceId: null, sources: [], users: [], permissions: {} };

permissionManager.loadPermissions().then(data => {
    if (!data) return;
    state.permissions = data.permissions || {};
    navigationManager.renderNavigation(data.permissions);
    navigationManager.setActivePage('sources');
    navigationManager.setPageTitle('Sources');
    navigationManager.setUserInfo(data);
    loadData();
});

async function loadData() {
    const headers = { 'Authorization': `Token ${permissionManager.token}` };
    try {
        const [sourcesRes, usersRes] = await Promise.all([
            fetch('/leads/api/sources/', { headers }),
            fetch('/account/api/lead-owners/', { headers })
        ]);
        state.sources = await sourcesRes.json();
        state.users = await usersRes.json();
        renderContent();
        renderUserOptions();
    } catch (e) {
        console.error(e);
        window.location.href = '/login/';
    }
}

function renderContent() {
    const area = document.getElementById('content-area');
    if (!state.sources.length) {
        area.innerHTML = UI.empty('No sources found');
        return;
    }

    const cols = ['Source', 'Unassigned', 'Action'];
    area.innerHTML = UI.headerRow(cols) + state.sources.map(source => {
        const stats = source.assignment_stats || { total_assigned: 0, unassigned: 0 };
        const canAssign = state.permissions.leads_change_source && stats.unassigned > 0;

        return UI.dataRow([
            { content: source.name, class: 'text-sm text-gray-900 dark:text-gray-300 truncate' },
            { content: stats.unassigned, class: 'text-sm text-gray-600 dark:text-gray-400' },
            { content: canAssign ?
                `<button onclick="openModal(${source.id}, '${source.name}')" class="px-3 py-1 text-xs text-gray-700 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 rounded hover:bg-gray-200 dark:hover:bg-gray-700">Assign</button>` :
                '<span class="text-gray-300 dark:text-gray-600">-</span>'
            }
        ]);
    }).join('');
}

function renderUserOptions() {
    const select = document.getElementById('modal-user');
    select.innerHTML = '<option value="">Select a user...</option>' +
        state.users.map(u => {
            const name = u.first_name && u.last_name ? `${u.first_name} ${u.last_name}` : u.username;
            return `<option value="${u.id}">${name}</option>`;
        }).join('');
}

function openModal(id, name) {
    state.sourceId = id;
    document.getElementById('modal-source').value = name;
    UI.modal.show('modal');
}

function closeModal() {
    state.sourceId = null;
    document.getElementById('modal-user').value = '';
    document.getElementById('modal-limit').value = '100';
    UI.modal.hide('modal');
}

document.getElementById('modal-confirm').addEventListener('click', async () => {
    const userId = document.getElementById('modal-user').value;
    const limit = document.getElementById('modal-limit').value;
    if (!userId) return alert('Please select a user');

    const res = await fetch(`/leads/api/sources/${state.sourceId}/bulk_assign/`, {
        method: 'PATCH',
        headers: {
            'Authorization': `Token ${permissionManager.token}`,
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ assigned_to_id: parseInt(userId), limit: parseInt(limit) })
    });

    const data = await res.json();
    if (data.assigned_count !== undefined) {
        alert(`Assigned ${data.assigned_count} leads`);
        closeModal();
        loadData();
    } else {
        alert('Error: ' + JSON.stringify(data));
    }
});

document.getElementById('refresh-btn').addEventListener('click', () => UI.refreshBtn('refresh-icon', loadData));
</script>
{% endblock %}
