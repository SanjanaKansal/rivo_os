{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Leads - Rivo OS{% endblock %}

{% block content %}
{% include 'dashboard/navigation.html' %}

<div id="main-content" class="min-h-screen bg-gray-50 dark:bg-gray-950 transition-all duration-200">
    <main class="h-[calc(100vh-3.5rem)] lg:h-screen flex flex-col" style="padding: var(--space-page);">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg flex-1 flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-6 py-3 border-b border-gray-100 dark:border-gray-800">
                <div class="flex" id="tabs"></div>
                <button id="refresh-btn" class="p-1.5 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-md" title="Refresh">
                    <svg id="refresh-icon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
            <div id="content-area" class="flex-1 overflow-auto">
                <div class="px-6 py-8 text-center text-sm text-gray-400">Loading...</div>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-900 rounded-lg p-6 w-full max-w-md border border-gray-200 dark:border-gray-800">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4">Mark as <span id="modal-status"></span></h3>
        <textarea id="modal-note" rows="3" placeholder="Add a note (optional)" class="w-full px-3 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-400"></textarea>
        <div class="flex justify-end gap-3 mt-4">
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700">Cancel</button>
            <button id="modal-confirm" class="px-4 py-2 text-sm font-medium text-white bg-gray-900 dark:bg-gray-100 dark:text-gray-900 rounded-md hover:bg-gray-800 dark:hover:bg-gray-200">Confirm</button>
        </div>
    </div>
</div>

<style>
.grid-row { grid-template-columns: repeat(4, 1fr); }
</style>

<script src="{% static 'dashboard/js/permissions.js' %}"></script>
<script src="{% static 'dashboard/js/components.js' %}"></script>
<script>
const state = {
    statuses: [], defaultStatus: 'PENDING', activeTab: null,
    leads: [], pendingGroups: [],
    userId: null, permissions: {},
    modalLeadId: null, modalStatus: null
};

permissionManager.loadPermissions().then(data => {
    if (!data) return;
    state.permissions = data.permissions || {};
    state.userId = data.id;
    navigationManager.renderNavigation(data.permissions);
    navigationManager.setActivePage('leads');
    navigationManager.setPageTitle('Leads');
    navigationManager.setUserInfo(data);
    loadData();
});

async function loadData() {
    const headers = { 'Authorization': `Token ${permissionManager.token}` };
    try {
        const [choicesRes, leadsRes, pendingRes] = await Promise.all([
            fetch('/leads/api/leads/choices/', { headers }),
            fetch('/leads/api/leads/', { headers }),
            fetch('/leads/api/leads/?status=PENDING&group_by=assigned_by', { headers })
        ]);

        state.statuses = (await choicesRes.json()).statuses;
        state.defaultStatus = state.statuses[0]?.value || 'PENDING';
        state.leads = (await leadsRes.json()).sort((a, b) => new Date(b.creation_time) - new Date(a.creation_time));
        state.pendingGroups = await pendingRes.json();

        const urlTab = new URLSearchParams(window.location.search).get('tab')?.toUpperCase();
        state.activeTab = state.statuses.find(s => s.value === urlTab) ? urlTab : state.defaultStatus;

        renderTabs();
        renderContent();
    } catch (e) {
        console.error(e);
        window.location.href = '/login/';
    }
}

function renderTabs() {
    document.getElementById('tabs').innerHTML = state.statuses.map(s =>
        UI.tab(s.label, state.leads.filter(l => l.status === s.value).length, s.value === state.activeTab, { key: 'status', value: s.value })
    ).join('');
}

function renderContent() {
    const isPending = state.activeTab === state.defaultStatus;
    document.getElementById('content-area').innerHTML = isPending ? renderGrouped() : renderFlat();
}

function renderGrouped() {
    if (!state.pendingGroups.length) return UI.empty('No pending leads');

    const actionStatuses = state.statuses.filter(s => s.value !== state.defaultStatus);
    const cols = ['Name', 'Phone', 'Intent', 'Actions'];

    return state.pendingGroups.map((group, idx) => {
        const person = group.assigned_by_id === state.userId ? group.assigned_to : group.assigned_by;
        const headerHtml = `
            <span class="text-sm text-gray-900 dark:text-gray-300">${group.source}</span>
            <span class="text-xs px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-500">${group.count}</span>
        `;
        const metaHtml = `<span>${person}</span><span>·</span><span>${UI.formatTime(group.assigned_at)}</span>`;

        const rows = UI.headerRow(cols) + group.leads.map(lead => UI.dataRow([
            { content: lead.name, class: 'text-sm text-gray-900 dark:text-gray-300 truncate' },
            { content: lead.phone, class: 'text-sm text-gray-600 dark:text-gray-400' },
            { content: lead.intent, class: 'text-sm text-gray-500 dark:text-gray-500 truncate', title: lead.intent },
            { content: state.permissions.leads_change_rawlead ? actionStatuses.map(s =>
                `<button onclick="openModal(${lead.id}, '${s.value}')" class="btn-action btn-action-${s.value.toLowerCase()}">${s.label}</button>`
            ).join(' ') : '-', class: 'flex gap-2' }
        ])).join('');

        return UI.group(headerHtml, rows, idx, metaHtml);
    }).join('');
}

function renderFlat() {
    const filtered = state.leads.filter(l => l.status === state.activeTab);
    if (!filtered.length) {
        const label = state.statuses.find(s => s.value === state.activeTab)?.label?.toLowerCase() || '';
        return UI.empty(`No ${label} leads`);
    }

    return UI.headerRow(['Name', 'Phone', 'Source', 'Notes']) + filtered.map(lead => UI.dataRow([
        { content: lead.name || '-', class: 'text-sm text-gray-900 dark:text-gray-300 truncate' },
        { content: lead.phone, class: 'text-sm text-gray-600 dark:text-gray-400' },
        { content: lead.source_details?.name || '-', class: 'text-sm text-gray-500 dark:text-gray-500 truncate', title: lead.source_details?.name },
        { content: lead.note || '-', class: 'text-sm text-gray-500 dark:text-gray-500 truncate', title: lead.note }
    ])).join('');
}

function setTab(status) {
    state.activeTab = status;
    history.replaceState({}, '', `?tab=${status.toLowerCase()}`);
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.status === status));
    renderContent();
}

document.getElementById('tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab-btn');
    if (tab) setTab(tab.dataset.status);
});

function openModal(leadId, status) {
    state.modalLeadId = leadId;
    state.modalStatus = status;
    document.getElementById('modal-status').textContent = state.statuses.find(s => s.value === status)?.label || status;
    document.getElementById('modal-note').value = '';
    UI.modal.show('modal');
}

function closeModal() { UI.modal.hide('modal'); }

document.getElementById('modal-confirm').addEventListener('click', async () => {
    const note = document.getElementById('modal-note').value.trim();
    const payload = { status: state.modalStatus };
    if (note) payload.note = note;

    const res = await fetch(`/leads/api/leads/${state.modalLeadId}/update_status/`, {
        method: 'PATCH',
        headers: {
            'Authorization': `Token ${permissionManager.token}`,
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify(payload)
    });

    if (res.ok) { closeModal(); loadData(); }
    else alert('Error updating status');
});

document.getElementById('refresh-btn').addEventListener('click', () => UI.refreshBtn('refresh-icon', loadData));
</script>
{% endblock %}
