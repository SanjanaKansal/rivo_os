{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Leads - Rivo OS{% endblock %}

{% block content %}
{% include 'dashboard/navigation.html' %}

<div id="main-content" class="min-h-screen bg-gray-50 dark:bg-gray-950 transition-all duration-200">
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 lg:px-6 py-8">
        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg px-4 py-3">
                <div class="text-xs font-medium text-gray-500 dark:text-gray-400">Total</div>
                <div id="total-count" class="text-2xl font-semibold text-gray-900 dark:text-gray-100 mt-1">0</div>
            </div>
            <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg px-4 py-3">
                <div class="text-xs font-medium text-gray-500 dark:text-gray-400">Pending</div>
                <div id="pending-count" class="text-2xl font-semibold text-amber-600 dark:text-amber-500 mt-1">0</div>
            </div>
            <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg px-4 py-3">
                <div class="text-xs font-medium text-gray-500 dark:text-gray-400">Valid</div>
                <div id="valid-count" class="text-2xl font-semibold text-emerald-600 dark:text-emerald-500 mt-1">0</div>
            </div>
        </div>

        <!-- Leads Table -->
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg">
            <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100 dark:border-gray-800">
                <h2 class="text-base font-medium text-gray-900 dark:text-gray-100">All Leads</h2>
                <div class="flex items-center space-x-3">
                    <select id="status-filter" class="px-3 py-1.5 text-sm border border-gray-200 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-400 dark:focus:ring-gray-600 focus:border-gray-400 dark:focus:border-gray-600">
                        <option value="">All Status</option>
                        <option value="PENDING">Pending</option>
                        <option value="VALID">Valid</option>
                        <option value="SPAM">Spam</option>
                    </select>
                    <button id="refresh-btn" class="p-1.5 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-md transition-colors" title="Refresh">
                        <svg id="refresh-icon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-gray-100 dark:border-gray-800">
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400">Phone</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400">Source</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400">Intent</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400">Created</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leads-tbody" class="divide-y divide-gray-100 dark:divide-gray-800">
                        <tr>
                            <td colspan="8" class="px-6 py-8 text-center text-sm text-gray-400 dark:text-gray-500">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Update Status Modal -->
<div id="status-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-900 rounded-lg p-6 w-full max-w-md border border-gray-200 dark:border-gray-800">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4">Mark Lead as <span id="modal-status-type"></span></h3>
        <textarea id="status-note" rows="3" placeholder="Add a note (optional)" class="w-full px-3 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-400 dark:focus:ring-gray-600"></textarea>
        <div class="flex justify-end space-x-3 mt-4">
            <button onclick="closeStatusModal()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Cancel</button>
            <button id="confirm-status-btn" class="px-4 py-2 text-sm font-medium text-white bg-gray-900 dark:bg-gray-100 dark:text-gray-900 rounded-md hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors">Confirm</button>
        </div>
    </div>
</div>

<script src="{% static 'dashboard/js/permissions.js' %}"></script>
<script>
    let allLeads = [];
    let userPermissions = {};
    let currentLeadId = null;
    let currentStatus = null;

    // Load user data and permissions
    permissionManager.loadPermissions().then(data => {
        if (data) {
            userPermissions = data.permissions || {};

            // Setup navigation
            navigationManager.renderNavigation(data.permissions);
            navigationManager.setActivePage('leads');
            navigationManager.setPageTitle('Leads');
            navigationManager.setUserInfo(data);

            // Load leads after permissions are loaded
            loadLeads();
        }
    });

    // Fetch and display leads
    function loadLeads() {
        fetch('/leads/api/leads/', {
            headers: {
                'Authorization': `Token ${permissionManager.token}`
            }
        })
        .then(response => {
            if (!response.ok) throw new Error('Unauthorized');
            return response.json();
        })
        .then(data => {
            allLeads = data;
            updateStats(data);
            displayLeads(data);
        })
        .catch(error => {
            console.error('Error:', error);
            localStorage.removeItem('auth_token');
            window.location.href = '/login/';
        });
    }

    function updateStats(leads) {
        const total = leads.length;
        const pending = leads.filter(l => l.status === 'PENDING').length;
        const valid = leads.filter(l => l.status === 'VALID').length;

        document.getElementById('total-count').textContent = total;
        document.getElementById('pending-count').textContent = pending;
        document.getElementById('valid-count').textContent = valid;
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function displayLeads(leads) {
        const tbody = document.getElementById('leads-tbody');
        if (leads.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-8 text-center text-sm text-gray-400">No leads found</td></tr>';
            return;
        }

        tbody.innerHTML = leads.map(lead => `
            <tr class="hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                <td class="px-6 py-3.5 text-sm font-medium text-gray-900 dark:text-gray-100">${lead.name || '-'}</td>
                <td class="px-6 py-3.5 text-sm text-gray-600 dark:text-gray-400">${lead.phone}</td>
                <td class="px-6 py-3.5 text-sm text-gray-600 dark:text-gray-400">${lead.email || '-'}</td>
                <td class="px-6 py-3.5 text-sm text-gray-600 dark:text-gray-400">${lead.source_details?.name || '-'}</td>
                <td class="px-6 py-3.5 text-sm text-gray-600 dark:text-gray-400 max-w-xs truncate" title="${lead.intent || ''}">${lead.intent || '-'}</td>
                <td class="px-6 py-3.5 text-sm text-gray-600 dark:text-gray-400">${formatDate(lead.creation_time)}</td>
                <td class="px-6 py-3.5">
                    <span class="inline-flex px-2 py-0.5 text-xs font-medium rounded border ${
                        lead.status === 'VALID' ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800' :
                        lead.status === 'SPAM' ? 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-400 border-rose-200 dark:border-rose-800' :
                        'bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-800'
                    }">
                        ${lead.status}
                    </span>
                    ${lead.note ? `<div class="text-xs text-gray-500 dark:text-gray-400 mt-1 italic">${lead.note}</div>` : ''}
                </td>
                <td class="px-6 py-3.5 text-sm">
                    ${(lead.status === 'PENDING' && userPermissions.can_edit_leads) ? `
                        <div class="flex space-x-2">
                            <button onclick="openStatusModal(${lead.id}, 'VALID')"
                                    class="px-2.5 py-1 text-xs font-medium text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950 border border-emerald-200 dark:border-emerald-800 rounded-md hover:bg-emerald-100 dark:hover:bg-emerald-900 transition-colors">
                                Valid
                            </button>
                            <button onclick="openStatusModal(${lead.id}, 'SPAM')"
                                    class="px-2.5 py-1 text-xs font-medium text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950 border border-rose-200 dark:border-rose-800 rounded-md hover:bg-rose-100 dark:hover:bg-rose-900 transition-colors">
                                Spam
                            </button>
                        </div>
                    ` : '<span class="text-gray-300 dark:text-gray-600">-</span>'}
                </td>
            </tr>
        `).join('');
    }

    function filterLeads() {
        const statusFilter = document.getElementById('status-filter').value;
        let filtered = allLeads;

        if (statusFilter) {
            filtered = filtered.filter(l => l.status === statusFilter);
        }

        displayLeads(filtered);
    }

    function openStatusModal(leadId, newStatus) {
        currentLeadId = leadId;
        currentStatus = newStatus;
        document.getElementById('modal-status-type').textContent = newStatus;
        document.getElementById('status-note').value = '';
        document.getElementById('status-modal').classList.remove('hidden');
    }

    function closeStatusModal() {
        document.getElementById('status-modal').classList.add('hidden');
        currentLeadId = null;
        currentStatus = null;
    }

    function updateStatus() {
        const note = document.getElementById('status-note').value.trim();
        const payload = { status: currentStatus };
        if (note) {
            payload.note = note;
        }

        fetch(`/leads/api/leads/${currentLeadId}/update_status/`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Token ${permissionManager.token}`,
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.id) {
                closeStatusModal();
                loadLeads();
            } else {
                alert('Error: ' + JSON.stringify(data));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to update status');
        });
    }

    // Refresh with spin animation
    function refreshWithSpin() {
        const icon = document.getElementById('refresh-icon');
        icon.style.transform = 'rotate(180deg)';
        setTimeout(() => { icon.style.transform = 'rotate(0deg)'; }, 300);
        loadLeads();
    }

    // Event listeners
    document.getElementById('status-filter').addEventListener('change', filterLeads);
    document.getElementById('refresh-btn').addEventListener('click', refreshWithSpin);
    document.getElementById('confirm-status-btn').addEventListener('click', updateStatus);
</script>
{% endblock %}
