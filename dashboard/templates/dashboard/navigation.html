<!-- Dynamic Sidebar Navigation -->
<aside id="sidebar" class="fixed inset-y-0 left-0 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 transform -translate-x-full lg:translate-x-0 z-30 flex flex-col">

    <!-- Collapse Toggle (center-right edge) -->
    <button id="sidebar-collapse-btn" class="hidden lg:flex absolute top-1/2 -translate-y-1/2 -right-3 w-6 h-6 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 shadow-sm z-50 transition-colors duration-150" title="Toggle sidebar">
        <svg id="collapse-icon" class="w-3.5 h-3.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
    </button>

    <!-- Logo -->
    <div class="logo-container h-14 flex items-center px-2 border-b border-gray-100 dark:border-gray-800">
        <a href="/" class="nav-item flex-1" data-tooltip="Rivo OS">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
            <span class="text-base font-semibold text-gray-900 dark:text-white sidebar-text">Rivo OS</span>
        </a>
        <button id="sidebar-close" class="lg:hidden p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <!-- Primary Navigation -->
    <nav id="nav-menu" class="flex-1 py-4 px-2 space-y-2 overflow-y-auto"></nav>

    <!-- Bottom Section -->
    <div class="border-t border-gray-100 dark:border-gray-800 px-2 py-2 space-y-1">
        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="nav-item w-full" data-tooltip="Toggle theme">
            <svg class="nav-icon dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
            <svg class="nav-icon hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <span class="sidebar-text">Dark mode</span>
        </button>

        <!-- User Profile -->
        <div class="nav-item" data-tooltip="Profile">
            <svg class="nav-icon text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span id="sidebar-user-name" class="sidebar-text truncate"></span>
        </div>

        <!-- Logout -->
        <button id="logout-btn" onclick="permissionManager.logout()" class="nav-item w-full logout-item" data-tooltip="Logout">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            <span class="sidebar-text">Logout</span>
        </button>
    </div>
</aside>

<!-- Mobile Overlay -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 lg:hidden hidden transition-opacity duration-200"></div>

<!-- Mobile Header -->
<header class="lg:hidden fixed top-0 inset-x-0 h-14 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 z-10 flex items-center px-4 gap-3">
    <button id="sidebar-toggle" class="p-1.5 -ml-1.5 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
    <svg class="w-5 h-5 text-gray-700 dark:text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
    </svg>
    <span class="text-base font-semibold text-gray-900 dark:text-white">Rivo OS</span>
</header>

<style>
/* Sidebar base and width states */
@media (min-width: 1024px) {
    #sidebar {
        width: 13rem; /* Default expanded */
        transition: width 180ms ease-out;
    }
    #sidebar.sidebar-collapsed {
        width: 4rem;
    }
    #sidebar.sidebar-expanded {
        width: 13rem;
    }
}

/* Content Offset with transition */
@media (min-width: 1024px) {
    #main-content {
        padding-left: 13rem; /* Default expanded */
        transition: padding-left 180ms ease-out;
    }
    #main-content.content-collapsed {
        padding-left: 4rem;
    }
    #main-content.content-expanded {
        padding-left: 13rem;
    }
}

/* Mobile Top Padding */
@media (max-width: 1023px) {
    #main-content { padding-top: 3.5rem; }
}

/* Text fade transition */
.sidebar-text {
    opacity: 1;
    transition: opacity 150ms ease-out;
    white-space: nowrap;
}
.sidebar-collapsed .sidebar-text {
    opacity: 0;
    width: 0;
    overflow: hidden;
}

/* Nav Items */
.nav-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: #6b7280;
    border-radius: 0.375rem;
    transition: all 150ms ease;
    position: relative;
}
.nav-item:hover {
    background: #f3f4f6;
    color: #111827;
}
.nav-item.active {
    background: #f3f4f6;
    color: #111827;
}
.dark .nav-item { color: #9ca3af; }
.dark .nav-item:hover, .dark .nav-item.active {
    background: #1f2937;
    color: #f9fafb;
}

/* Logout hover */
.logout-item:hover {
    color: #dc2626 !important;
    background: #fef2f2 !important;
}
.dark .logout-item:hover {
    color: #f87171 !important;
    background: rgba(127, 29, 29, 0.3) !important;
}

/* Nav Icon */
.nav-icon {
    width: 1.25rem;
    height: 1.25rem;
    flex-shrink: 0;
}

/* Collapsed State Adjustments */
.sidebar-collapsed .nav-item {
    justify-content: center;
    padding: 0.5rem;
    gap: 0;
}
.sidebar-collapsed #nav-menu,
.sidebar-collapsed .border-t {
    padding-left: 0.75rem;
    padding-right: 0.75rem;
}

/* Logo centering when collapsed */
.sidebar-collapsed .logo-container {
    justify-content: center;
    padding-left: 0.75rem;
    padding-right: 0.75rem;
}

/* Tooltip for collapsed state */
.sidebar-collapsed .nav-item::after {
    content: attr(data-tooltip);
    position: absolute;
    left: calc(100% + 0.75rem);
    top: 50%;
    transform: translateY(-50%);
    padding: 0.375rem 0.75rem;
    background: #1f2937;
    color: white;
    font-size: 0.75rem;
    font-weight: 500;
    border-radius: 0.375rem;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: opacity 150ms ease, visibility 150ms ease;
    pointer-events: none;
    z-index: 100;
}
.sidebar-collapsed .nav-item::before {
    content: '';
    position: absolute;
    left: calc(100% + 0.25rem);
    top: 50%;
    transform: translateY(-50%);
    border: 5px solid transparent;
    border-right-color: #1f2937;
    opacity: 0;
    visibility: hidden;
    transition: opacity 150ms ease, visibility 150ms ease;
    pointer-events: none;
    z-index: 100;
}
.sidebar-collapsed .nav-item:hover::after,
.sidebar-collapsed .nav-item:hover::before {
    opacity: 1;
    visibility: visible;
}

/* Dark mode tooltip */
.dark .sidebar-collapsed .nav-item::after {
    background: #374151;
}
.dark .sidebar-collapsed .nav-item::before {
    border-right-color: #374151;
}
</style>

<script>
// Navigation Config
const NAV_CONFIG = [
    {
        id: 'dashboard',
        label: 'Dashboard',
        href: '/',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>',
        permission: null
    },
    {
        id: 'sources',
        label: 'Sources',
        href: '/sources/',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>',
        permission: 'can_view_sources'
    },
    {
        id: 'leads',
        label: 'Leads',
        href: '/leads/',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>',
        permission: 'can_view_leads'
    }
];

class NavigationManager {
    constructor() {
        this.sidebar = document.getElementById('sidebar');
        this.navMenu = document.getElementById('nav-menu');
        this.overlay = document.getElementById('sidebar-overlay');
        this.collapseBtn = document.getElementById('sidebar-collapse-btn');
        this.collapseIcon = document.getElementById('collapse-icon');
        this.isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
        this.init();
    }

    init() {
        document.getElementById('sidebar-toggle')?.addEventListener('click', () => this.open());
        document.getElementById('sidebar-close')?.addEventListener('click', () => this.close());
        this.overlay?.addEventListener('click', () => this.close());
        this.collapseBtn?.addEventListener('click', () => this.toggle());

        // Apply state immediately for sidebar
        this.applySidebarState();

        // Apply content state when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => this.applyContentState());
        } else {
            this.applyContentState();
        }
    }

    applySidebarState() {
        if (this.isCollapsed) {
            this.sidebar.classList.remove('sidebar-expanded');
            this.sidebar.classList.add('sidebar-collapsed');
            if (this.collapseIcon) this.collapseIcon.style.transform = 'rotate(180deg)';
        } else {
            this.sidebar.classList.remove('sidebar-collapsed');
            this.sidebar.classList.add('sidebar-expanded');
            if (this.collapseIcon) this.collapseIcon.style.transform = 'rotate(0deg)';
        }
    }

    applyContentState() {
        const content = document.getElementById('main-content');
        if (!content) return;

        if (this.isCollapsed) {
            content.classList.remove('content-expanded');
            content.classList.add('content-collapsed');
        } else {
            content.classList.remove('content-collapsed');
            content.classList.add('content-expanded');
        }
    }

    open() {
        this.sidebar.classList.remove('-translate-x-full');
        this.overlay.classList.remove('hidden');
    }

    close() {
        this.sidebar.classList.add('-translate-x-full');
        this.overlay.classList.add('hidden');
    }

    toggle() {
        this.isCollapsed = !this.isCollapsed;
        localStorage.setItem('sidebar_collapsed', this.isCollapsed);
        this.applyState(true);
    }

    applyState(animate = true) {
        const content = document.getElementById('main-content');

        // Apply classes
        if (this.isCollapsed) {
            this.sidebar.classList.remove('sidebar-expanded');
            this.sidebar.classList.add('sidebar-collapsed');
            content?.classList.remove('content-expanded');
            content?.classList.add('content-collapsed');
            if (this.collapseIcon) this.collapseIcon.style.transform = 'rotate(180deg)';
        } else {
            this.sidebar.classList.remove('sidebar-collapsed');
            this.sidebar.classList.add('sidebar-expanded');
            content?.classList.remove('content-collapsed');
            content?.classList.add('content-expanded');
            if (this.collapseIcon) this.collapseIcon.style.transform = 'rotate(0deg)';
        }
    }

    renderNavigation(permissions = {}) {
        this.navMenu.innerHTML = NAV_CONFIG
            .filter(item => !item.permission || permissions[item.permission])
            .map(item => `
                <a href="${item.href}" class="nav-item" data-page="${item.id}" data-tooltip="${item.label}">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">${item.icon}</svg>
                    <span class="sidebar-text">${item.label}</span>
                </a>
            `).join('');
    }

    setActivePage(pageId) {
        this.navMenu.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.page === pageId);
        });
    }

    setUserInfo(data) {
        const el = document.getElementById('sidebar-user-name');
        if (el) el.textContent = data.first_name || data.username;
        // Update profile tooltip
        const profileItem = el?.closest('.nav-item');
        if (profileItem) profileItem.dataset.tooltip = data.first_name || data.username;
    }

    getCollapseState() { return this.isCollapsed; }
    setPageTitle() {}
}

const navigationManager = new NavigationManager();
</script>
