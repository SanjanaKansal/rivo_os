{% extends 'dashboard/base.html' %}
{% load static %}
{% block content %}
{% include 'dashboard/navigation.html' %}

<div id="main-content" class="min-h-screen bg-gray-50 dark:bg-gray-950 transition-all duration-200">
    <main class="h-[calc(100vh-3.5rem)] lg:h-screen flex flex-col" style="padding: var(--space-page);">
        <div class="flex items-center justify-between mb-4">
            <div id="filters" class="flex bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-800 p-1"></div>
            <button id="refresh-btn" class="p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-white dark:hover:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-800" title="Refresh">
                <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            </button>
        </div>

        <div id="summary-cards" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-4">
            <div class="bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-800 p-4">
                <div class="text-2xl font-semibold text-gray-900 dark:text-gray-100" id="total-leads">-</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Total Assigned</div>
            </div>
            <div class="bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-800 p-4">
                <div class="text-2xl font-semibold text-amber-600 dark:text-amber-500" id="total-pending">-</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Pending Review</div>
            </div>
            <div class="bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-800 p-4">
                <div class="text-2xl font-semibold text-emerald-600 dark:text-emerald-500" id="total-valid">-</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Valid Leads</div>
            </div>
            <div class="bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-800 p-4">
                <div class="text-2xl font-semibold text-gray-900 dark:text-gray-100" id="avg-quality">-</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Avg Quality</div>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-800 flex-1 flex flex-col overflow-hidden">
            <div id="content-area" class="flex-1 overflow-auto"><div class="px-6 py-12 text-center text-sm text-gray-400">Loading...</div></div>
        </div>
    </main>
</div>

<script src="{% static 'dashboard/js/permissions.js' %}"></script>
<script src="{% static 'dashboard/js/components.js' %}"></script>
<script>
const state = { campaigns: [], period: 'all', permissions: {} };
const periods = [{ label: 'Today', value: 'today' }, { label: 'This Week', value: 'week' }, { label: 'All Time', value: 'all' }];

permissionManager.loadPermissions().then(data => {
    if (!data) return;
    state.permissions = data.permissions || {};
    navigationManager.renderNavigation(data.permissions);
    navigationManager.setActivePage('campaigns');
    navigationManager.setUserInfo(data);
    renderFilters();
    loadData();
});

function renderFilters() {
    document.getElementById('filters').innerHTML = periods.map(p => UI.filterBtn(p.label, p.value, p.value === state.period)).join('');
}

async function loadData() {
    try {
        const res = await fetch(`/leads/api/leads/campaign_performance/?period=${state.period}`, {
            headers: { 'Authorization': `Token ${permissionManager.token}` }
        });
        state.campaigns = (await res.json()).campaigns || [];
        renderSummary();
        renderTable();
    } catch (e) { window.location.href = '/login/'; }
}

function renderSummary() {
    const t = state.campaigns.reduce((a, c) => ({ total: a.total + c.total, pending: a.pending + c.pending, valid: a.valid + c.valid, spam: a.spam + c.spam }), { total: 0, pending: 0, valid: 0, spam: 0 });
    const reviewed = t.valid + t.spam;
    document.getElementById('total-leads').textContent = t.total;
    document.getElementById('total-pending').textContent = t.pending;
    document.getElementById('total-valid').textContent = t.valid;
    document.getElementById('avg-quality').textContent = `${reviewed > 0 ? Math.round((t.valid / reviewed) * 100) : 0}%`;
}

function renderTable() {
    const area = document.getElementById('content-area');
    if (!state.campaigns.length) { area.innerHTML = UI.empty('No campaign data for this period'); return; }

    const rows = state.campaigns.map((c, i) => {
        const childRows = (c.lead_owners || []).map(o => UI.statsRow(o.name, o)).join('');
        return UI.statsGroup(c.campaign_name, UI.formatTime(c.last_assigned_at), c, childRows, i);
    }).join('');

    area.innerHTML = UI.statsTableHeader(['Campaign / Lead Owner', 'Total', 'Pending', 'Valid', 'Spam', 'Quality']) + rows;
}

document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.ui-filter-btn');
    if (!btn) return;
    document.querySelectorAll('.ui-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.period = btn.dataset.period;
    loadData();
});

document.getElementById('refresh-btn').addEventListener('click', () => UI.refreshBtn('refresh-icon', loadData));
</script>
{% endblock %}
